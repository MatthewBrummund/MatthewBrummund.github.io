name: Build and deploy

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Runs on every branch so a broken build is caught before it reaches prod.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v4
        if: github.ref == 'refs/heads/prod'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/prod'
        with:
          path: ./out

  # Only the prod branch is published to GitHub Pages.
  deploy:
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
